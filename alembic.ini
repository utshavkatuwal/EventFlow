[alembic]
script_location = database/migrations
prepend_sys_path = .
version_table = alembic_version
# Placeholder only — database/migrations/env.py overrides this with settings.DATABASE_URL.
# Set DATABASE_URL in .env; never put real credentials here.
sqlalchemy.url = mysql+pymysql://eventflow_user:change-me@localhost:3306/eventflow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic.runtime

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
